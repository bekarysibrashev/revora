services:
  - type: web
    name: revora-api-bekarysibrashev
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    initialDeployHook: >-
      python -m app.cli.create_initial_owner
      --tenant-name "Demo Clinic"
      --tenant-slug demo
      --branch-name "Main Branch"
      --branch-code main
      --email "$DEMO_OWNER_EMAIL"
      --full-name "Clinic Owner"
      --password "$DEMO_OWNER_PASSWORD"
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: revora-db-bekarysibrashev
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: MINIO_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://revora-web-bekarysibrashev.onrender.com,https://revoradent.netlify.app
      - key: DEMO_OWNER_EMAIL
        sync: false
      - key: DEMO_OWNER_PASSWORD
        sync: false
      - key: LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: LOGIN_LOCK_MINUTES
        value: "15"
      - key: KCELL_CRM_TOKEN
        sync: false
      - key: KCELL_TENANT_SLUG
        value: test1
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_AD_ACCOUNT_IDS
        sync: false
      - key: META_GRAPH_API_VERSION
        value: v25.0
      - key: META_TENANT_SLUG
        value: test1
      - key: OPENAI_API_KEY
        sync: false
      - key: ANALYST_AI_PROVIDER
        value: groq
      - key: ANALYST_AI_MODEL
        value: openai/gpt-oss-120b
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: CALL_AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: CALL_TRANSCRIPTION_MODEL
        value: whisper-large-v3-turbo
      - key: CALL_ANALYSIS_MODEL
        value: openai/gpt-oss-20b
      - key: CALL_MIN_DURATION_SECONDS
        value: "7"
      - key: CALL_MAX_AUDIO_BYTES
        value: "25000000"
      - key: CALL_ANALYSIS_TIMEOUT_SECONDS
        value: "120"
      - key: EMBEDDED_CALL_WORKER
        value: "true"
      - key: EMBEDDED_CALL_WORKER_INTERVAL_SECONDS
        value: "20"
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_DATA_KEY
        sync: false
      - key: META_APP_ID
        value: "965678616515017"
      - key: WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID
        value: "2277685509673688"
      - key: WHATSAPP_TENANT_SLUG
        value: test1
      - key: WHATSAPP_GRAPH_API_VERSION
        value: v25.0
      - key: WHATSAPP_AI_PROVIDER
        value: rules
      - key: WHATSAPP_AI_MODEL
        value: openai/gpt-oss-20b
      - key: WHATSAPP_AI_AUTO_SEND
        value: "false"
      - key: WHATSAPP_MONTHLY_BUDGET_KZT
        value: "10000"
      - key: WHATSAPP_MAX_CONTEXT_MESSAGES
        value: "12"
      - key: WHATSAPP_USD_KZT_RATE
        value: "550"

  - type: web
    name: revora-web-bekarysibrashev
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/out
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://revora-api-bekarysibrashev.onrender.com/api/v1

databases:
  - name: revora-db-bekarysibrashev
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: revora
    user: revora
    ipAllowList: []
