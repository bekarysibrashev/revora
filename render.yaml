services:
  - type: web
    name: revora-san-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    initialDeployHook: >-
      python -m app.cli.create_initial_owner
      --tenant-name "SAN Dental"
      --tenant-slug sandental
      --branch-name "Сейфуллина"
      --branch-code seifullina
      --extra-branch-name "Батыс Мура"
      --extra-branch-code batys-mura
      --email "$INITIAL_OWNER_EMAIL"
      --full-name "Владелец SAN Dental"
      --password "$INITIAL_OWNER_PASSWORD"
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: revora-san-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: MINIO_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://revora-san-web-k0sa.onrender.com
      - key: INITIAL_OWNER_EMAIL
        sync: false
      - key: INITIAL_OWNER_PASSWORD
        sync: false
      - key: LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: LOGIN_LOCK_MINUTES
        value: "15"
      - key: KCELL_CRM_TOKEN
        sync: false
      - key: KCELL_TENANT_SLUG
        value: sandental
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_AD_ACCOUNT_IDS
        sync: false
      - key: META_GRAPH_API_VERSION
        value: v25.0
      - key: META_TENANT_SLUG
        value: sandental
      - key: META_ATTRIBUTION_WINDOWS
        value: 7d_click,1d_view
      - key: META_ACTION_REPORT_TIME
        value: impression
      - key: META_AUTO_SYNC_ENABLED
        value: "true"
      - key: META_AUTO_SYNC_INTERVAL_MINUTES
        value: "180"
      - key: META_AUTO_SYNC_LOOKBACK_DAYS
        value: "30"
      - key: OPENAI_API_KEY
        sync: false
      - key: ANALYST_AI_PROVIDER
        value: groq
      - key: ANALYST_AI_MODEL
        value: openai/gpt-oss-120b
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: CALL_AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: CALL_TRANSCRIPTION_MODEL
        value: whisper-large-v3-turbo
      - key: CALL_ANALYSIS_MODEL
        value: openai/gpt-oss-20b
      - key: CALL_MIN_DURATION_SECONDS
        value: "10"
      - key: CALL_MAX_AUDIO_BYTES
        value: "25000000"
      - key: CALL_ANALYSIS_TIMEOUT_SECONDS
        value: "120"
      - key: EMBEDDED_CALL_WORKER
        value: "true"
      - key: EMBEDDED_CALL_WORKER_INTERVAL_SECONDS
        value: "20"
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_DATA_KEY
        sync: false
      - key: META_APP_ID
        value: "965678616515017"
      - key: WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID
        value: "2277685509673688"
      - key: WHATSAPP_TENANT_SLUG
        value: sandental
      - key: WHATSAPP_GRAPH_API_VERSION
        value: v25.0
      - key: WHATSAPP_AI_PROVIDER
        value: rules
      - key: WHATSAPP_AI_MODEL
        value: openai/gpt-oss-20b
      - key: WHATSAPP_AI_AUTO_SEND
        value: "false"
      - key: WHATSAPP_MONTHLY_BUDGET_KZT
        value: "10000"
      - key: WHATSAPP_MAX_CONTEXT_MESSAGES
        value: "12"
      - key: WHATSAPP_USD_KZT_RATE
        value: "550"
      - key: WHATSAPP_QR_GATEWAY_URL
        fromService:
          type: web
          name: revora-whatsapp-gateway
          envVarKey: RENDER_EXTERNAL_URL
      - key: WHATSAPP_QR_GATEWAY_SECRET
        fromService:
          type: web
          name: revora-whatsapp-gateway
          envVarKey: WHATSAPP_QR_GATEWAY_SECRET
      - key: WHATSAPP_ADMIN_PAUSE_MINUTES
        value: "60"

  - type: worker
    name: revora-san-telegram
    runtime: python
    plan: starter
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.telegram_worker
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: revora-san-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: MINIO_SECRET_KEY
        generateValue: true
      - key: PLATFORM_ADMIN_TOKEN
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_POLL_TIMEOUT_SECONDS
        value: "25"
      - key: ANALYST_AI_PROVIDER
        value: groq
      - key: ANALYST_AI_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1

  - type: web
    name: revora-san-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/out
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://revora-san-api-0sj5.onrender.com/api/v1

  - type: web
    name: revora-whatsapp-gateway
    runtime: node
    plan: free
    region: frankfurt
    rootDir: whatsapp-gateway
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: REVORA_API_URL
        fromService:
          type: web
          name: revora-san-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: WHATSAPP_QR_GATEWAY_SECRET
        generateValue: true

databases:
  - name: revora-san-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: revora
    user: revora
    ipAllowList: []
